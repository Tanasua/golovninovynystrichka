name: News comparison bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/news-comparison-bot-ukrnet-n1abgw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one check cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m src.run_once

      # state.json (уже надіслані посилання) комітимо назад у репозиторій,
      # інакше кожен запуск GitHub Actions стартує "з нуля" й дублюватиме
      # сповіщення, поки glavred не напише новину.
      - name: Persist state.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update bot state [skip ci]"
            git push
          else
            echo "state.json без змін — коміт не потрібен"
          fi
